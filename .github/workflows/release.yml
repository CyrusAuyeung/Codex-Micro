name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，与 main 中的 package.json 一致，例如 2.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and native self-tests
        run: python build.py
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: .\runtime\node.exe scripts/check-version.mjs "$env:RELEASE_VERSION"
      - name: JavaScript and API tests
        run: .\runtime\node.exe scripts/test.mjs
      - name: Package
        run: python scripts/package.py
      - name: Verify installation, upgrade and uninstall
        run: python scripts/verify-package.py
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx --no-install playwright install chromium
      - name: Browser UI tests
        run: .\runtime\node.exe scripts/ui-smoke.mjs
      - name: Desktop UI tests
        run: .\runtime\node.exe scripts/ui-smoke.mjs --native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          path: |
            .build/release/*-Setup-x64.exe
            .build/release/SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-x64
          path: .build/release
      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
          MICRO_RELEASE_VERSION: ${{ inputs.version }}
          MICRO_RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/publish-release.py
